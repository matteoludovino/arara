# Render Blueprint (free plan). Create it from the dashboard: New > Blueprint > this repository.
# PostgreSQL is external (Neon free plan): fill DATABASE_URL with its direct connection string.
services:
  - type: web
    name: arara-api
    runtime: docker
    plan: free              # sleeps after 15 min without traffic; the first request wakes it (~1 min)
    region: virginia        # next to the Neon database (aws-us-east-1)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true # random value generated by Render
      - key: DATABASE_URL
        sync: false         # Neon, direct (not pooled) connection string, with ?sslmode=require
      - key: WEB_ORIGIN
        sync: false         # the Vercel URL, e.g. https://arara-demo.vercel.app (trusted for CSRF)
      - key: DEMO_MODE
        value: "true"       # public demo: fictional data, reset nightly, cheaper password hashing
      - key: CREDENTIALS_RATE
        value: "60/min"     # behind the proxies every visitor shares one address: a looser limit
