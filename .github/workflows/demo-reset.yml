# The public demo starts over every night: a fresh fictional shop with weeks of history.
# The seed writes through the real services, which takes a minute or two with a full CPU (the
# free API instance has a tenth of one), so it runs here, against the database directly.
# Needs the repository secret DEMO_DATABASE_URL (the same Neon URL the API uses).
# Note: GitHub disables scheduled workflows after 60 days without repository activity.
name: Demo reset

on:
  schedule:
    - cron: "0 6 * * *" # 03:00 in São Paulo
  workflow_dispatch:

concurrency:
  group: demo-reset

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked --no-dev
      - name: Seed
        env:
          DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
          DEMO_MODE: "true"
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DEMO_DATABASE_URL is not set"; exit 1; fi
          uv run --no-dev python manage.py seed_demo --reset
