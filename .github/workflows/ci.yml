name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The stock guarantees live in PostgreSQL (CHECK constraints, triggers, row locks):
    # tests run against a real one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arara
          POSTGRES_PASSWORD: arara
          POSTGRES_DB: arara
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U arara -d arara"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgres://arara:arara@localhost:5436/arara
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py spectacular --file /dev/null --validate --fail-on-warn
      - run: uv run pytest
